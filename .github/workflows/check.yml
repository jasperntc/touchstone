name: Check

# Everything here is deterministic and free: no model is called, nothing is
# spawned. The blind runs are the expensive part and they are recorded as
# artifacts, not re-executed on push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not a tag: a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history and every tag. test_the_hole_is_real and verify.py
          # read history on purpose, and the evidence check below diffs
          # against the pre-release-baseline tag.
          fetch-depth: 0
          persist-credentials: false

      # skill-creator's schema, read where it lives and never copied here.
      # Pinned: a change upstream reaches this repository only as a deliberate
      # edit of this SHA. Checked out after the step above, whose clean would
      # otherwise remove it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: anthropics/claude-plugins-official
          ref: 2a8ad9f74633d10e3d9bb0660a03bfc6e50584b1
          path: .ci/claude-plugins-official
          sparse-checkout: plugins/skill-creator/skills/skill-creator/references
          persist-credentials: false

      # The minor version, not a patch: everything here is stdlib, the .pyc
      # files the history ever carried are cpython-312, and a patch pin fails
      # the day the runner image stops shipping that build.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # The record as tagged before release prep, compared tree to tree. Git's
      # blob ids are content hashes of the stored bytes, so a checkout's line
      # endings cannot make this pass or fail -- a hash manifest over working
      # files could, and did, in agency-agents.
      - name: The evidence is where the baseline left it
        run: git diff --exit-code pre-release-baseline HEAD -- eval/runs/ eval/prereg/ eval/tasks/key/ docs/findings.md

      # Every committed answer re-scored with the committed key, every
      # artifact regenerated and diffed, every headline number in findings.md
      # recomputed. --require-git makes a skipped history check a failure.
      - name: The record re-derives from the committed answers
        run: python tools/verify.py --require-git

      # A correct implementation must pass every check. When this fails the
      # bug is in the key, not in the answer.
      - name: The key accepts a correct answer
        run: python3 eval/harness/run_checks.py --self-test

      # And the naive draft must clear the functional floor while failing the
      # discriminators. A task its naive draft aces cannot measure anything.
      - name: The key can still say no
        run: python3 eval/harness/run_checks.py --calibrate

      # Neither of the two gates above notices a narrow convention quietly
      # becoming visible inside the task's own package, which would leave
      # everything green while turning the experiment into a different one.
      # The partial draft has to fail exactly the narrow set.
      - name: The instrument reads at three levels
        run: python3 eval/harness/run_checks.py --drafts

      # The README promises that a skill without a RESULT.md fails CI. This is
      # the line that makes that true.
      - name: Nothing unproven in skills/
        run: python3 -m unittest tests.test_gates -v

      # F002's `none/q4m` recovered the conventions with `git show`. These
      # tests assert the hole is real and that the staged fixture closes it.
      - name: The fixture is served outside every repository
        run: python3 -m unittest tests.test_isolation -v

      # The three gates that sit on top of skill-creator. Each is
      # mutation-checked in the test file: removing the precedence check, the
      # ceiling check or the spread floor fails exactly one test each.
      - name: The gates skill-creator does not have
        run: python3 -m unittest tests.test_prereg -v
        env:
          TOUCHSTONE_SKILL_CREATOR_SCHEMA: .ci/claude-plugins-official/plugins/skill-creator/skills/skill-creator/references/schemas.md
          # A schema that moved upstream must turn this red, not skip it.
          TOUCHSTONE_REQUIRE_SKILL_CREATOR_SCHEMA: "1"

      # Every gate at its boundary and one step past it, with the timing cases
      # run against throwaway repositories rather than eval/prereg/.
      - name: Each gate, at its boundary
        run: python3 -m unittest tests.test_prereg_gates -v

      # The file above, run against copies of prereg.py with one comparison
      # inverted per gate. Each copy must fail at least one test.
      - name: The gate tests can fail
        run: python3 -m unittest tests.test_prereg_mutants -v

      # A recommender draws on a catalogue it mostly does not own. The one
      # thing only this repository can add is what was measured about each
      # entry -- so nothing may claim proven-here without a RESULT.md naming a
      # control. The check caught its own matcher labelling all 31 marketplace
      # skills as ours on the first run.
      - name: Nothing claims evidence it does not have
        run: python3 tools/catalogue.py --check

      - name: Catalogue regression tests
        run: python3 -m unittest tests.test_catalogue -v

      # Prose that states a rule is the answer key in disguise. Reported, not
      # enforced -- code that demonstrates a convention is the point.
      - name: Prose audit
        run: python3 eval/harness/stage.py --audit

      # The tree diff above compares commits and cannot see the working copy.
      # Anything verify.py or a test wrote into the evidence shows up here.
      - name: Nothing above wrote into the evidence
        run: |
          out=$(git status --porcelain -- eval/runs/ eval/prereg/ eval/tasks/key/ docs/findings.md)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
